<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flowy — sin conexión</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #fafafb;
        color: #1a1a2e;
      }
      .card {
        text-align: center;
        padding: 3rem 2rem;
        max-width: 28rem;
      }
      .icon {
        width: 4.5rem;
        height: 4.5rem;
        border-radius: 1.2rem;
        background: linear-gradient(135deg, #60a5fa, #3b82f6);
        display: grid;
        place-items: center;
        margin: 0 auto 1.5rem;
        box-shadow: 0 12px 32px rgba(59, 130, 246, 0.35);
      }
      svg {
        width: 2.6rem;
        height: 2.6rem;
      }
      h1 {
        font-size: 1.35rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0;
        color: #6b7280;
        line-height: 1.6;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0a0a0a;
          color: #fafafa;
        }
        p {
          color: #9ca3af;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon" aria-hidden="true">
        <svg viewBox="0 0 32 32">
          <path
            d="M12 22a7 7 0 1 0 14 0c0-2-1-3.5-3-5.5l-4-4-4 4c-2 2-3 3.5-3 5.5z"
            fill="#fff"
            transform="translate(-3,-2) scale(0.9)"
          />
        </svg>
      </div>
      <h1>Estás sin conexión</h1>
      <p>
        Flowy no pudo cargar esta página. Conectate a internet para seguir
        controlando tus finanzas.
      </p>
    </main>
  </body>
</html>
