name: Vercel Deployment Monitor

on:
  deployment_status:

jobs:
  monitor-deployment:
    name: 🌐 Deploy status & health
    runs-on: ubuntu-latest
    if: github.event.deployment_status.state == 'success' || github.event.deployment_status.state == 'failure'
    steps:
      - name: Deployment Status
        run: |
          echo "🚀 Deployment Status: ${{ github.event.deployment_status.state }}"
          echo "🌐 Deployment URL: ${{ github.event.deployment_status.environment_url }}"
          echo "📦 Environment: ${{ github.event.deployment_status.environment }}"
          echo "📅 Deployed at: $(date)"

      - name: Success Notification
        if: github.event.deployment_status.state == 'success'
        run: |
          echo "✅ Deployment successful!"
          echo "Your app is live at: ${{ github.event.deployment_status.environment_url }}"

      - name: Failure Notification
        if: github.event.deployment_status.state == 'failure'
        run: |
          echo "❌ Deployment failed!"
          echo "Check Vercel dashboard for details"
          exit 1

      - name: Check Application Health
        if: github.event.deployment_status.state == 'success'
        run: |
          echo "Checking application health..."
          DEPLOY_URL="${{ github.event.deployment_status.environment_url }}"
          if curl -f -s -o /dev/null "$DEPLOY_URL"; then
            echo "✅ Application is responding"
          else
            echo "⚠️  Application deployed but not responding"
          fi
