name: Manual Deploy
run-name: 'Deploy · ${{ inputs.environment }} · ${{ inputs.ref }} · @${{ github.actor }}'

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        type: choice
        options:
          - production
          - preview
        default: production
      ref:
        description: 'Git ref (branch, tag, or SHA) to deploy'
        type: string
        default: 'main'

permissions:
  contents: read
  deployments: write

concurrency:
  group: manual-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: 🚀 Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment == 'production' && 'deploy-production' || 'preview' }}
    timeout-minutes: 20
    steps:
      - name: Checkout ${{ inputs.ref }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Deploy to Vercel
        id: vercel
        uses: amondnet/vercel-action@16e87c0a08142b0d0d33b76aeaf20823c381b9b9 # v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: ${{ inputs.environment == 'production' && '--prod' || '' }}
          github-comment: false

      - name: Health check
        run: |
          if [ "${{ inputs.environment }}" == "production" ]; then
            URL="https://flowy-jade.vercel.app"
          else
            URL="${{ steps.vercel.outputs.preview-url }}"
          fi
          HEALTH_URL="${URL%/}/api/health"
          if [ -z "$URL" ] || [ "$URL" == "null" ]; then
            echo "::warning::No deployment URL available — skipping health check."
            exit 0
          fi
          echo "Checking $HEALTH_URL ..."
          for i in 1 2 3 4 5; do
            RESPONSE=$(curl -f -sS --max-time 30 "$HEALTH_URL" 2>/dev/null || true)
            if [ -n "$RESPONSE" ] && printf '%s' "$RESPONSE" | node -e '
              let input = "";
              process.stdin.on("data", (chunk) => (input += chunk));
              process.stdin.on("end", () => {
                const body = JSON.parse(input);
                process.exit(body.status === "healthy" && body.database === "connected" ? 0 : 1);
              });
            '; then
              echo "✅ $HEALTH_URL is healthy"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "❌ $HEALTH_URL did not become healthy"
          exit 1
