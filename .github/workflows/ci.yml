name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          # Dummy values only: the build constructs Prisma and Supabase clients
          # at module load but never connects to anything, so placeholders are
          # sufficient to pass client construction in CI.
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/flowy
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role
          CRON_SECRET: placeholder-cron-secret

  guardrails:
    name: Branch & PR conventions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Branch name convention
        # Bot PRs are exempt — their branches (dependabot/pnpm/...,
        # release-please--branches--..., ...) are generated by tools, not
        # humans. Covers dependabot[bot], github-actions[bot], release-please[bot]
        # and any future bot. Note: head_ref is passed via env (not interpolated
        # into the script) to avoid shell injection from untrusted branch names.
        if: ${{ !endsWith(github.actor, '[bot]') }}
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if ! [[ "$BRANCH" =~ ^(feat|fix|refactor|chore|docs|ci|perf|test)/[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "::error::Branch name '$BRANCH' must be <type>/<kebab-slug> (e.g. feat/add-export, fix/amount-input, docs/readme)."
            exit 1
          fi
          echo "Branch '$BRANCH' follows the <type>/<kebab-slug> convention."

      - name: PR links an issue (code changes only)
        if: ${{ !endsWith(github.actor, '[bot]') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR="${{ github.event.pull_request.number }}"
          TITLE=$(gh pr view "$PR" --repo "${{ github.repository }}" --json title -q .title)
          BODY=$(gh pr view "$PR" --repo "${{ github.repository }}" --json body -q .body)
          TYPE="${TITLE%%:*}"        # "feat(export): ..." -> "feat(export)"
          TYPE="${TYPE%%(*}"         # strip scope         -> "feat"
          if [[ "$TYPE" =~ ^(feat|fix|refactor|perf|test)$ ]]; then
            if ! grep -qE 'Closes #[0-9]+|Fixes #[0-9]+|Resolves #[0-9]+' <<< "$BODY"; then
              echo "::error::$TYPE PRs must link an issue in the body (e.g. 'Closes #12')."
              exit 1
            fi
            echo "PR links an issue (Closes/Fixes/Resolves #N present)."
          else
            echo "PR type '$TYPE' does not require an issue link."
          fi
