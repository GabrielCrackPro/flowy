name: CI
run-name: 'CI ${{ github.event.pull_request.title || github.ref_name }} · @${{ github.actor }}'

on:
  pull_request:
  push:
    branches: [main]
    # Every main commit is a squash-merged PR that already ran CI, so the
    # push run is a re-verification, not the first pass. Only re-run it when
    # the merge actually touched code/config that affects the build —
    # docs/CI-only merges (README, .github/workflows, CHANGELOG) skip it.
    # Keep this list in sync with the "Detect code changes" regex in the
    # quality job below (which matches these extensions anywhere + these
    # root config files).
    paths:
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.mjs"
      - "**/*.cjs"
      - "**/*.css"
      - "**/*.prisma"
      - "prisma/**"
      - "supabase/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "next.config.ts"
      - "tailwind.config.ts"
      - "postcss.config.mjs"
      - "components.json"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    # NOTE: keep this exact job name — the "Block main" ruleset requires the
    # status check "Lint, Typecheck & Build". Renaming it blocks merges. The job
    # always runs (so the required check is always reported); Typecheck/Build are
    # skipped inside it when a PR contains no code changes (docs/CI/config only).
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Detect code changes
        id: code
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            CHANGED=$(git diff --name-only "$BASE" "$GITHUB_SHA")
          else
            git fetch --no-tags --depth=1 origin "$BASE" 2>/dev/null || true
            CHANGED=$(git diff --name-only "$BASE" "$GITHUB_SHA" 2>/dev/null || true)
          fi
          echo "Changed files:"
          printf '%s\n' "$CHANGED"
          if [ -z "$CHANGED" ] || printf '%s\n' "$CHANGED" | grep -qE '(\.(ts|tsx|js|jsx|mjs|cjs|css|prisma)$)|(^prisma/)|(^supabase/)|(^package\.json$)|(^pnpm-lock\.yaml$)|(^next\.config\.ts$)|(^tailwind\.config\.ts$)|(^postcss\.config\.mjs$)|(^components\.json$)'
          then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Code changes detected — running Typecheck & Build."
          else
            echo "code_changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Docs/config-only change — skipping Typecheck & Build."
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Next.js build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        if: steps.code.outputs.code_changed == 'true'
        run: pnpm typecheck

      - name: Build
        if: steps.code.outputs.code_changed == 'true'
        run: pnpm build
        env:
          # Dummy values only: the build constructs Prisma and Supabase clients
          # at module load but never connects to anything, so placeholders are
          # sufficient to pass client construction in CI.
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/flowy
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role
          CRON_SECRET: placeholder-cron-secret

  api-docs:
    # Keeps the OpenAPI spec (public/openapi.json) truthful: regenerates it
    # from code and fails if the committed file drifts, then lints it with
    # Redocly and verifies every route handler is documented.
    name: API Docs (OpenAPI drift + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate spec from code
        run: pnpm generate:openapi

      - name: Spec must be committed (no drift)
        run: |
          if ! git diff --exit-code -- public/openapi.json; then
            echo "::error::public/openapi.json is out of date — run 'pnpm generate:openapi' and commit the result."
            exit 1
          fi

      - name: Lint spec (Redocly)
        run: pnpm lint:openapi

      - name: Route inventory drift guard
        run: pnpm check:openapi-routes

  changelog:
    # Keeps the in-app changelog data (src/lib/changelog/generated.json)
    # truthful: regenerates it from CHANGELOG.md and fails if the committed
    # file drifts. Pure Node — no dependency install needed.
    #
    # PRs only (main is always the result of a merged green PR) and release
    # PRs are exempt: release-please cannot run the generator, but bumps
    # $.currentVersion via extra-files and the sync-changelog workflow
    # (sync-changelog.yml) syncs the new entries right after the release.
    name: Changelog (drift guard)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Regenerate changelog data from CHANGELOG.md
        run: node scripts/generate-changelog.mjs

      - name: Data must be committed (no drift)
        run: |
          if git diff --exit-code -- src/lib/changelog/generated.json; then
            echo "Changelog data is in sync."
          # The quoted literal "[bot]" is intentional: an unquoted *[bot]
          # would be a bash character class (matching b/o/t), not the bot
          # suffix. release-please PRs are authored by github-actions[bot].
          elif [[ "${{ github.event.pull_request.user.login }}" == *"[bot]" ]]; then
            echo "::notice::Release PR: release-please does not run the generator — currentVersion is bumped via extra-files and the next code PR syncs the changelog entries."
          else
            echo "::error::src/lib/changelog/generated.json is out of date — run 'pnpm generate:changelog' and commit the result."
            exit 1
          fi

  guardrails:
    name: 🛡️ Branch & PR conventions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Branch name convention
        # Bot PRs are exempt — their branches (dependabot/pnpm/...,
        # release-please--branches--..., ...) are generated by tools, not
        # humans. Covers dependabot[bot], github-actions[bot], release-please[bot]
        # and any future bot. Check the PR author (pull_request.user.login),
        # NOT github.actor: on reopened/synchronize events the actor is whoever
        # triggered the event (often a human), not the author. Note: head_ref is
        # passed via env (not interpolated into the script) to avoid shell
        # injection from untrusted branch names.
        if: ${{ !endsWith(github.event.pull_request.user.login, '[bot]') }}
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if ! [[ "$BRANCH" =~ ^(feat|fix|refactor|chore|docs|ci|perf|test)/[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "::error::Branch name '$BRANCH' must be <type>/<kebab-slug> (e.g. feat/add-export, fix/amount-input, docs/readme)."
            exit 1
          fi
          echo "Branch '$BRANCH' follows the <type>/<kebab-slug> convention."

      - name: Read PR metadata
        id: pr_body
        if: ${{ !endsWith(github.event.pull_request.user.login, '[bot]') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR="${{ github.event.pull_request.number }}"
          TITLE=$(gh pr view "$PR" --repo "${{ github.repository }}" --json title -q .title)
          BODY=$(gh pr view "$PR" --repo "${{ github.repository }}" --json body -q .body)
          {
            echo 'body<<EOF'
            echo "$BODY"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: PR links an issue (code changes only)
        if: ${{ !endsWith(github.event.pull_request.user.login, '[bot]') }}
        env:
          TITLE: ${{ steps.pr_body.outputs.title }}
          BODY: ${{ steps.pr_body.outputs.body }}
        run: |
          TYPE="${TITLE%%:*}"        # "feat(export): ..." -> "feat(export)"
          TYPE="${TYPE%%(*}"         # strip scope         -> "feat"
          if [[ "$TYPE" =~ ^(feat|fix|refactor|perf|test)$ ]]; then
            if ! grep -qE 'Closes #[0-9]+|Fixes #[0-9]+|Resolves #[0-9]+' <<< "$BODY"; then
              echo "::error::$TYPE PRs must link an issue in the body (e.g. 'Closes #12')."
              exit 1
            fi
            echo "PR links an issue (Closes/Fixes/Resolves #N present)."
          else
            echo "PR type '$TYPE' does not require an issue link."
          fi

      - name: Database migration disclosure
        if: ${{ !endsWith(github.event.pull_request.user.login, '[bot]') }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          BODY: ${{ steps.pr_body.outputs.body }}
        run: |
          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          MIGRATION_FILES=$(printf '%s\n' "$CHANGED" | grep -E '^(prisma/migrations/|supabase/migrations/|prisma/schema\.prisma$)' || true)

          if [ -z "$MIGRATION_FILES" ]; then
            echo "No database migration files changed."
            exit 0
          fi

          echo "Database-related files changed:"
          printf '%s\n' "$MIGRATION_FILES"
          if ! grep -qiE '\[[xX]\][[:space:]]*Requires a DB migration' <<< "$BODY"; then
            echo "::error::Database changes require the PR template checkbox '[x] Requires a DB migration' and an apply/rollback plan in the Test plan."
            exit 1
          fi

          if printf '%s\n' "$MIGRATION_FILES" | grep -q '^prisma/schema\.prisma$' && ! printf '%s\n' "$CHANGED" | grep -q '^prisma/migrations/'; then
            echo "::error::prisma/schema.prisma changed without a matching Prisma migration."
            exit 1
          fi
          echo "Migration disclosure is present and schema changes include a Prisma migration."

      - name: Push trigger paths in sync with code-change regex
        # The push-trigger `paths` filter (on.push.paths) must mirror the
        # "Detect code changes" regex in the quality job. The check derives
        # both sides from the workflow file and fails on any mismatch.
        run: node scripts/check-ci-trigger-sync.mjs
